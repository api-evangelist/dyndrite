name: Dyndrite
description: 'Dyndrite develops GPU-accelerated software for digital and additive manufacturing, focused
  on laser powder bed fusion (LPBF) and other metal 3D-printing processes. Its platform streamlines build
  preparation, materials development, process qualification, and production automation for industrial
  manufacturers, machine builders (OEMs), and software vendors. Products include Dyndrite LPBF Pro for
  end users and the Application Development Kit (ADK) for machine makers, exposing low-level toolpathing
  control (Vector and Raster Toolpathing APIs) plus a scriptable Python geometry engine. Dyndrite is
  backed by Amplify Partners and is tracked in the API Evangelist network as an AI/ML and manufacturing
  automation company. It does not currently publish a public web/REST API, OpenAPI definition, or
  self-service developer portal; its APIs are embedded scripting and integration interfaces delivered
  inside its desktop software and ADK.'
